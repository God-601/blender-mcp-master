<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 310" width="1440" height="310" role="img" aria-labelledby="t d">
<title id="t">From brief to verified asset</title><desc id="d">Five stages: clarify, blockout, refine, inspect and deliver, with the inspect stage looping back when correction is needed.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141a27"/><stop offset="1" stop-color="#11151f"/></linearGradient><linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb677"/><stop offset="1" stop-color="#ef6530"/></linearGradient></defs>
<rect width="1440" height="310" rx="22" fill="url(#bg)"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="45" y="52" fill="#f7f8fa" font-size="27" font-weight="750">From intent to evidence.</text><text x="45" y="79" fill="#8f9eb2" font-size="16">The result matters more than a successful command.</text></g>
<g transform="translate(44 111)" font-family="Segoe UI,Arial,sans-serif">
<g transform="translate(0 0)"><rect width="244" height="112" rx="14" fill="#1f2837" stroke="#49617d"/><text x="20" y="35" fill="#ffac72" font-size="15" font-weight="700">01 / CLARIFY</text><text x="20" y="72" fill="#f1f4f8" font-size="21" font-weight="700">Understand</text><text x="20" y="96" fill="#9baac0" font-size="14">Ask only what matters</text></g>
<g transform="translate(275 0)"><rect width="244" height="112" rx="14" fill="#1f2837" stroke="#49617d"/><text x="20" y="35" fill="#ffac72" font-size="15" font-weight="700">02 / BLOCKOUT</text><text x="20" y="72" fill="#f1f4f8" font-size="21" font-weight="700">Shape</text><text x="20" y="96" fill="#9baac0" font-size="14">Proportions before detail</text></g>
<g transform="translate(550 0)"><rect width="244" height="112" rx="14" fill="#1f2837" stroke="#49617d"/><text x="20" y="35" fill="#ffac72" font-size="15" font-weight="700">03 / REFINE</text><text x="20" y="72" fill="#f1f4f8" font-size="21" font-weight="700">Build</text><text x="20" y="96" fill="#9baac0" font-size="14">Topology, UV, material</text></g>
<g transform="translate(825 0)"><rect width="244" height="112" rx="14" fill="#2f2729" stroke="#ff9146" stroke-width="2"/><text x="20" y="35" fill="#ffac72" font-size="15" font-weight="700">04 / INSPECT</text><text x="20" y="72" fill="#f1f4f8" font-size="21" font-weight="700">Prove</text><text x="20" y="96" fill="#e1ac8d" font-size="14">Geometry + actual views</text></g>
<g transform="translate(1100 0)"><rect width="244" height="112" rx="14" fill="#1b302c" stroke="#71b4a4"/><text x="20" y="35" fill="#92e9cb" font-size="15" font-weight="700">05 / DELIVER</text><text x="20" y="72" fill="#f1f4f8" font-size="21" font-weight="700">Hand off</text><text x="20" y="96" fill="#99c9bb" font-size="14">Evidence + limitations</text></g>
</g>
<g stroke="#f2a66f" stroke-width="2.5" stroke-linecap="round" fill="none"><path d="M293 167h22m-9 -8 9 8 -9 8"/><path d="M568 167h22m-9 -8 9 8 -9 8"/><path d="M843 167h22m-9 -8 9 8 -9 8"/><path d="M1118 167h22m-9 -8 9 8 -9 8"/></g>
<path d="M989 231v33H737v-33" stroke="#fc9354" stroke-width="2" stroke-dasharray="6 6" fill="none"/><path d="m728 243 9 -12 9 12" stroke="#fc9354" stroke-width="2" fill="none"/><text x="861" y="289" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#ffab75" text-anchor="middle">Correct and inspect again</text>
</svg>