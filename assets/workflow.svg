<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d">
  <title id="t">The agent workflow</title>
  <desc id="d">Plan, blockout, refine, UV, material, validate, deliver, with a gate after blockout and a fix loop after validate</desc>
  <rect width="1200" height="330" rx="16" fill="#14181f"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="42" font-size="24" font-weight="700" fill="#ffffff">The core loop every agent follows</text>

    <g font-size="18" font-weight="600">
      <rect x="30"  y="92" width="140" height="84" rx="12" fill="#243245"/>
      <rect x="190" y="92" width="140" height="84" rx="12" fill="#243245"/>
      <rect x="350" y="92" width="140" height="84" rx="12" fill="#243245"/>
      <rect x="510" y="92" width="140" height="84" rx="12" fill="#243245"/>
      <rect x="670" y="92" width="140" height="84" rx="12" fill="#243245"/>
      <rect x="830" y="92" width="140" height="84" rx="12" fill="#ea7600"/>
      <rect x="990" y="92" width="180" height="84" rx="12" fill="#2f7d4f"/>
      <text x="100"  y="128" fill="#fff">1 PLAN</text>
      <text x="260"  y="128" fill="#fff">2 BLOCKOUT</text>
      <text x="420"  y="128" fill="#fff">3 REFINE</text>
      <text x="580"  y="128" fill="#fff">4 UV</text>
      <text x="740"  y="128" fill="#fff">5 MATERIAL</text>
      <text x="900"  y="128" fill="#14181f">6 VALIDATE</text>
      <text x="1080" y="128" fill="#fff">7 DELIVER</text>
    </g>
    <g font-size="14" fill="#c9d4e3">
      <text x="100"  y="152">target, budget,</text><text x="100"  y="170">units</text>
      <text x="260"  y="152">primitives,</text><text x="260"  y="170">real proportions</text>
      <text x="420"  y="152">bevels, details,</text><text x="420"  y="170">wireframe check</text>
      <text x="580"  y="152">seams, margins,</text><text x="580"  y="170">texel density</text>
      <text x="740"  y="152">PBR, named,</text><text x="740"  y="170">shared</text>
      <text x="900"  y="152" font-size="13" fill="#14181f">validate_asset.py</text><text x="900" y="170" font-size="13" fill="#14181f">PASS / WARN / INFO</text>
      <text x="1080" y="152">facts: tris, size,</text><text x="1080" y="170">materials, path</text>
    </g>

    <g stroke="#8fa3bd" stroke-width="2" fill="none">
      <line x1="170" y1="134" x2="190" y2="134"/><line x1="330" y1="134" x2="350" y2="134"/>
      <line x1="490" y1="134" x2="510" y2="134"/><line x1="650" y1="134" x2="670" y2="134"/>
      <line x1="810" y1="134" x2="830" y2="134"/><line x1="970" y1="134" x2="990" y2="134"/>
    </g>

    <!-- gate after blockout -->
    <rect x="190" y="204" width="140" height="48" rx="10" fill="none" stroke="#f5b041" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="260" y="226" font-size="14" font-weight="700" fill="#f5b041">GATE</text>
    <text x="260" y="244" font-size="13" fill="#c9d4e3">silhouette reads from 3 views</text>
    <line x1="260" y1="176" x2="260" y2="204" stroke="#f5b041" stroke-width="2"/>

    <!-- fix loop -->
    <path d="M 900 176 C 900 270, 420 270, 420 178" stroke="#e5534b" stroke-width="2.5" fill="none" stroke-dasharray="7 5"/>
    <polygon points="420,178 414,192 426,192" fill="#e5534b"/>
    <text x="660" y="288" font-size="15" font-weight="700" fill="#e5534b">unexplained WARN: fix or justify, then re-run</text>

    <text x="600" y="316" font-size="13" fill="#8fa3bd">Every step: one small script, print the result, look, then continue</text>
  </g>
</svg>
