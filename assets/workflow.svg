<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 305" width="1440" height="305" role="img" aria-labelledby="title description"><title id="title">Professional modeling loop</title><desc id="description">Five evenly aligned workflow cards linked by arrows and a continuous correction loop.</desc><defs><linearGradient id="surface" x2="1" y2="1"><stop stop-color="#121a28"/><stop offset="1" stop-color="#090e18"/></linearGradient><linearGradient id="amber" x2="1" y2="1"><stop stop-color="#ffc06b"/><stop offset="1" stop-color="#ff6834"/></linearGradient><radialGradient id="halo"><stop stop-color="#ff8739" stop-opacity=".26"/><stop offset="1" stop-color="#ff8739" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#a3b7d5" stroke-opacity=".10" fill="none"/></pattern></defs><rect width="1440" height="305" rx="22" fill="url(#surface)"/><g font-family="Arial,Helvetica,sans-serif"><text x="55" y="54" fill="#f7f8fb" font-size="29" font-weight="800">The production loop</text><text x="55" y="83" fill="#9caac0" font-size="17">A successful script is not a finished model.</text></g><rect x="55" y="112" width="246" height="121" rx="15" fill="#1d2838" stroke="#435b73" stroke-width="1.4"/><g font-family="Arial,Helvetica,sans-serif"><text x="74" y="143" fill="#ffac70" font-size="15" font-weight="700" letter-spacing="1">01 / CLARIFY</text><text x="74" y="185" fill="#f7f8fb" font-size="27" font-weight="750">Understand</text><text x="74" y="213" fill="#a7b7cb" font-size="16">Ask what matters</text></g><path d="M306 175h21m-8 -7 8 7 -8 7" stroke="#f6a16a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="335" y="112" width="246" height="121" rx="15" fill="#1d2838" stroke="#435b73" stroke-width="1.4"/><g font-family="Arial,Helvetica,sans-serif"><text x="354" y="143" fill="#ffac70" font-size="15" font-weight="700" letter-spacing="1">02 / BLOCKOUT</text><text x="354" y="185" fill="#f7f8fb" font-size="27" font-weight="750">Shape</text><text x="354" y="213" fill="#a7b7cb" font-size="16">Proportions first</text></g><path d="M586 175h21m-8 -7 8 7 -8 7" stroke="#f6a16a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="615" y="112" width="246" height="121" rx="15" fill="#1d2838" stroke="#435b73" stroke-width="1.4"/><g font-family="Arial,Helvetica,sans-serif"><text x="634" y="143" fill="#ffac70" font-size="15" font-weight="700" letter-spacing="1">03 / REFINE</text><text x="634" y="185" fill="#f7f8fb" font-size="27" font-weight="750">Build</text><text x="634" y="213" fill="#a7b7cb" font-size="16">Topology and look</text></g><path d="M866 175h21m-8 -7 8 7 -8 7" stroke="#f6a16a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="895" y="112" width="246" height="121" rx="15" fill="#2a2530" stroke="#f4a266" stroke-width="2"/><g font-family="Arial,Helvetica,sans-serif"><text x="914" y="143" fill="#ffac70" font-size="15" font-weight="700" letter-spacing="1">04 / INSPECT</text><text x="914" y="185" fill="#f7f8fb" font-size="27" font-weight="750">Verify</text><text x="914" y="213" fill="#a7b7cb" font-size="16">Real output checks</text></g><path d="M1146 175h21m-8 -7 8 7 -8 7" stroke="#f6a16a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="1175" y="112" width="246" height="121" rx="15" fill="#21332f" stroke="#7dbba8" stroke-width="1.4"/><g font-family="Arial,Helvetica,sans-serif"><text x="1194" y="143" fill="#93dfc3" font-size="15" font-weight="700" letter-spacing="1">05 / DELIVER</text><text x="1194" y="185" fill="#f7f8fb" font-size="27" font-weight="750">Hand off</text><text x="1194" y="213" fill="#a7b7cb" font-size="16">Evidence + limits</text></g><path d="M1018 234v30h-280v-30" stroke="#ffa263" stroke-width="2" stroke-dasharray="6 6" fill="none"/><path d="M731 244l7 -10 7 10" stroke="#ffa263" stroke-width="2" fill="none"/><text x="878" y="291" fill="#ffc093" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle">Correct and re-check</text></svg>