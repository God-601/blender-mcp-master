<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 260" width="1440" height="260" role="img" aria-labelledby="title description"><title id="title">Blender MCP Master architecture</title><desc id="description">Three aligned panels show that the agent reads the skill, calls the independent Blender MCP and works in a Blender scene.</desc><defs><linearGradient id="surface" x2="1" y2="1"><stop stop-color="#121a28"/><stop offset="1" stop-color="#090e18"/></linearGradient><linearGradient id="amber" x2="1" y2="1"><stop stop-color="#ffc06b"/><stop offset="1" stop-color="#ff6834"/></linearGradient><radialGradient id="halo"><stop stop-color="#ff8739" stop-opacity=".26"/><stop offset="1" stop-color="#ff8739" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#a3b7d5" stroke-opacity=".10" fill="none"/></pattern></defs><rect width="1440" height="260" rx="22" fill="url(#surface)"/><rect x="56" y="49" width="380" height="165" rx="18" fill="#1d293a" stroke="#526a85" stroke-width="1.6"/><text x="80" y="87" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#ffb476">01 / AI AGENT</text><text x="80" y="139" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" fill="#f7f8fb">Reads the skill</text><text x="80" y="177" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#aabbcf">Plans + reasons</text><rect x="530" y="49" width="380" height="165" rx="18" fill="#2c2a35" stroke="#ef9c5d" stroke-width="1.6"/><text x="554" y="87" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#ffb476">02 / CONTROL MCP</text><text x="554" y="139" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" fill="#f7f8fb">Calls Blender tools</text><text x="554" y="177" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#aabbcf">Separate connection</text><rect x="1004" y="49" width="380" height="165" rx="18" fill="#19302e" stroke="#76b7a0" stroke-width="1.6"/><text x="1028" y="87" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#ffb476">03 / BLENDER</text><text x="1028" y="139" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" fill="#f7f8fb">The live scene</text><text x="1028" y="177" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#aabbcf">Inspect + correct</text><path d="M455 133h48m-11 -10 11 10 -11 10" stroke="#ff9e5d" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M929 133h48m-11 -10 11 10 -11 10" stroke="#ff9e5d" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>