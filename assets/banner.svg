    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#313a45" stroke-width="1"/></pattern>
    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#18232d"/><stop offset="1" stop-color="#101920"/></linearGradient>
  </defs>
  <rect width="1440" height="460" rx="18" fill="#101820"/>
  <path d="M0 0h1440v6H0z" fill="#f18749"/>
  <rect x="746" y="35" width="659" height="390" rx="12" fill="url(#panel)" stroke="#34434d"/>
  <rect x="746" y="35" width="659" height="390" rx="12" fill="url(#grid)" opacity=".5"/>
  <g font-family="Arial, Helvetica, sans-serif">
