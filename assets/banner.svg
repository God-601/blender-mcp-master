<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 460" role="img" aria-labelledby="title description">
  <title id="title">Blender MCP Master — Agent Skill</title>
  <desc id="description">Concept illustration of a mesh inspection workflow. A measured wireframe object sits beside the skill's plan, model and verify stages; it is not a Blender render.</desc>
