    <text x="55" y="175" fill="#f6f2e9" font-size="71" font-weight="700" letter-spacing="-2">Blender MCP</text>
    <text x="55" y="251" fill="#f6f2e9" font-size="71" font-weight="700" letter-spacing="-2">Master<tspan fill="#f18749">.</tspan></text>
    <text x="58" y="315" fill="#b5c5cd" font-size="23">Plan the asset. Inspect the result.</text>
