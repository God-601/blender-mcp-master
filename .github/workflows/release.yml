name: Publish beta ZIP release and npm

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: blender-mcp-master-beta-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'God-601/blender-mcp-master'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NPM_TOKEN_SET: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Resolve package version
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          test "$VERSION" = '0.2.0-beta.1' || { echo 'This beta workflow only builds v0.2.0-beta.1'; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
      - name: Validate all bundled scripts, skill metadata and npm server
        run: |
          python -m unittest discover -s tests -v
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm pack --dry-run --ignore-scripts
      - name: Build and verify standalone Agent Skill ZIP
        run: |
          mkdir -p dist/blender-mcp-master
          cp -R SKILL.md README.md LICENSE references scripts assets dist/blender-mcp-master/
          ( cd dist && zip -q -r "blender-mcp-master-$VERSION.zip" blender-mcp-master )
          python - <<'PY'
          import os, zipfile
          path = f'dist/blender-mcp-master-{os.environ["VERSION"]}.zip'
          with zipfile.ZipFile(path) as archive:
              files = set(archive.namelist())
              required = ['SKILL.md','README.md','LICENSE','references/quality-checklist.md','scripts/validate_asset.py']
              assert all('blender-mcp-master/' + f in files for f in required), 'ZIP missing required skill resources'
              assert all(not name.startswith('/') and '..' not in name.split('/') for name in files), 'Unexpected archive path'
              assert archive.testzip() is None, 'Corrupt ZIP'
          print('Verified Agent Skill ZIP:', path)
          PY
          npm pack --ignore-scripts --pack-destination dist
          cd dist
          sha256sum "blender-mcp-master-$VERSION.zip" "blender-mcp-master-$VERSION.tgz" > SHA256SUMS.txt
      - name: Create public GitHub prerelease
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; retaining its immutable assets"
          else
            gh release create "$TAG" \
              "dist/blender-mcp-master-$VERSION.zip" \
              "dist/blender-mcp-master-$VERSION.tgz" \
              "dist/SHA256SUMS.txt" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Blender MCP Master $TAG (beta)" \
              --notes-file docs/release-notes-0.2.0-beta.1.md
          fi
      - name: Publish npm beta when authenticated
        if: env.NPM_TOKEN_SET == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "blender-mcp-master@$VERSION" version --json >/dev/null 2>&1; then
            echo "npm version $VERSION is already public; skipping duplicate publish"
          else
            npm publish --access public --provenance --tag beta
          fi
      - name: Report missing npm publisher credentials
        if: env.NPM_TOKEN_SET != 'true'
        run: |
          echo '::warning::GitHub release created but npm publish skipped: NPM_TOKEN repository secret is not configured.'
          echo 'Publish the initial package using an authorized npm account/token, then configure OIDC trusted publishing for future versions.'
