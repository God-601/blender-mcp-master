name: Static checks

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python-static:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # Without bpy the runtime tests are skipped; only parsing and text checks run here.
      - run: python -m unittest discover -s tests -v

  blender-runtime:
    # Runs the scripts in a real Blender (bpy wheel) once per Blender version. PyPI only ships
    # bpy 4.2 and newer, so Blender 3.x and 4.0/4.1 are NOT covered by CI.
    name: blender-runtime (bpy ${{ matrix.bpy }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { bpy: "4.2.23", python: "3.11" }   # LTS
          - { bpy: "4.5.15", python: "3.11" }   # LTS
          - { bpy: "5.0.1", python: "3.11" }
          - { bpy: "5.1.2", python: "3.13" }
          - { bpy: "5.2.3", python: "3.13" }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: System libraries needed by the bpy wheel
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libxi6 libxrender1 libxxf86vm1 libxfixes3 libsm6 libxkbcommon0
      - run: pip install bpy==${{ matrix.bpy }}
      # tests/run_all.py exits with the real result but skips interpreter teardown: bpy 4.2.x
      # segfaults at exit after a glTF export (see the docstring), which would fail the job
      # even though all tests passed.
      - name: Run all tests (fails if bpy cannot be imported)
        env:
          REQUIRE_BPY: "1"
        run: python tests/run_all.py -v
