name: npm package checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  npm-package:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm pack --dry-run
