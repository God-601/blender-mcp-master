name: Release readiness preflight (NO RELEASE)

# Nonpublishing checks only. This is not a stable build, tag, npm publish,
# or substitute for manual agent/Blender/game-engine acceptance.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    if: github.repository == 'God-601/blender-mcp-master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Static Python and release safety assertions
        run: |
          python -m unittest discover -s tests -v
      - name: npm installation, security and resource MCP checks
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --omit=dev --audit-level=high
          npm test
          npm pack --dry-run --ignore-scripts
      - name: Build and verify standalone nonpublishing readiness ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/blender-mcp-master
          cp -R SKILL.md README.md LICENSE CHANGELOG.md CONTRIBUTING.md references scripts integrations assets docs dist/blender-mcp-master/
          (cd dist && zip -q -r blender-mcp-master-1.2-PREFLIGHT-NOT-A-RELEASE.zip blender-mcp-master)
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re
          p = Path("dist/blender-mcp-master-1.2-PREFLIGHT-NOT-A-RELEASE.zip")
          with ZipFile(p) as archive:
              names = set(archive.namelist())
              required = (
                  "SKILL.md", "README.md", "LICENSE",
                  "references/p0-integrity.md",
                  "references/crash-recovery-and-baselines.md",
                  "references/component-fit-and-joints.md",
                  "scripts/scene_baseline_snapshot.py",
                  "scripts/compare_scene_baselines.py",
                  "scripts/inspect_component_fit.py",
                  "scripts/uv_diagnostics.py",
                  "docs/QUICKSTART.md",
                  "docs/RELEASE-1.2-EVIDENCE.md",
                  "scripts/game_asset_preflight.py",
                  "scripts/uv_island_gutter_audit.py",
                  "integrations/godot/gltf_import_probe.gd",
                  "integrations/godot/project.godot",
                  "integrations/godot/README.md",
              )
              assert all("blender-mcp-master/" + item in names for item in required), "Missing packaged file"
              assert all(not x.startswith("/") and ".." not in x.split("/") for x in names), "Unsafe ZIP entry"
              assert archive.testzip() is None, "Corrupt ZIP"
              readme = archive.read("blender-mcp-master/README.md").decode("utf-8")
              links = re.findall(r'\]\(([^)]+)\)', readme) + re.findall(r'(?:href|src)="([^"]+)"', readme)
              local = [link.split("#", 1)[0] for link in links
                       if not link.startswith(("http://", "https://", "#", "mailto:", "data:"))]
              missing = [link for link in local
                         if link and "blender-mcp-master/" + link not in names]
              assert not missing, "Packaged README contains broken local links: " + repr(missing)
          print("Nonpublishing package verified:", p, p.stat().st_size, "bytes")
          PY
          (cd dist && sha256sum blender-mcp-master-1.2-PREFLIGHT-NOT-A-RELEASE.zip > SHA256SUMS.txt)
          test -s dist/SHA256SUMS.txt
      - name: Fresh isolated skill install and integrity smoke
        run: |
          python scripts/clean_install_smoke.py \
            dist/blender-mcp-master-1.2-PREFLIGHT-NOT-A-RELEASE.zip \
            dist/SHA256SUMS.txt \
            --report dist/clean-install-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj = json.loads(Path("dist/clean-install-report.json").read_text(encoding="utf-8"))
          assert obj["result"] == "PASS"
          assert obj["actual_agent_discovery"] == "NOT VERIFIED"
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blender-mcp-master-1.2-PREFLIGHT-NOT-A-RELEASE
          path: |
            dist/blender-mcp-master-1.2-PREFLIGHT-NOT-A-RELEASE.zip
            dist/SHA256SUMS.txt
            dist/clean-install-report.json
          if-no-files-found: error
          retention-days: 30
