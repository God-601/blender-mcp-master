name: Publish v1.4.0 GitHub Release (explicitly authorized)

# Only runs after successful main-branch Static checks on the final SHA.
# Enforces npm/preflight/real Godot checks on the same SHA. No npm publish.
on:
  workflow_run:
    workflows: ["Static checks"]
    branches: [main]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: blender-mcp-master-v1.4.0-once
  cancel-in-progress: false

jobs:
  publish-v14:
    if: >-
      github.repository == 'God-601/blender-mcp-master' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      VERSION: '1.4.0'
      TAG: 'v1.4.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Verify exact main SHA, version and authorization evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GH_REPO}/branches/main" --jq '.commit.sha')" = "$RELEASE_SHA" || {
            echo "::error::Main changed after CI"; exit 1;
          }
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          node - <<'JS'
          const p = require("./package.json");
          const l = require("./package-lock.json");
          if (p.version !== "1.4.0" || l.version !== "1.4.0" || l.packages[""].version !== "1.4.0") {
            throw new Error("Manifest and lockfile must match approved v1.4.0");
          }
          JS
          test -f docs/release-notes-1.4.md
          test -f docs/V1.5-V2.0-MILESTONES.md
          test -f integrations/roblox/studio_mesh_audit.lua
          if gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag already exists; refusing to replace it"; exit 1
          fi
      - name: Require same-SHA successful release, npm and real engine checks
        shell: bash
        run: |
          set -euo pipefail
          for retry in $(seq 1 24); do
            runs="$(gh api "repos/${GH_REPO}/actions/runs?head_sha=${RELEASE_SHA}&per_page=100")"
            waiting=0
            for name in "npm package checks" "Release readiness preflight (NO RELEASE)" "Real Godot 4 GLB importer smoke"; do
              success="$(printf '%s' "$runs" | jq -r --arg n "$name" '[.workflow_runs[] | select(.name == $n and .event == "push" and .status == "completed" and .conclusion == "success")] | length')"
              failure="$(printf '%s' "$runs" | jq -r --arg n "$name" '[.workflow_runs[] | select(.name == $n and .event == "push" and .status == "completed" and .conclusion != "success")] | length')"
              if [ "$failure" -gt 0 ]; then
                echo "::error::CI failed: $name"; exit 1
              fi
              if [ "$success" -eq 0 ]; then waiting=$((waiting+1)); fi
            done
            if [ "$waiting" -eq 0 ]; then exit 0; fi
            if [ "$retry" -eq 24 ]; then
              echo "::error::Required exact-SHA CI did not finish"; exit 1
            fi
            sleep 10
          done
      - name: Recheck scripts, dependency security and npm contents
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          npm ci --ignore-scripts --no-fund
          npm audit --omit=dev --audit-level=high
          npm test
          npm pack --dry-run --ignore-scripts
      - name: Build standalone ZIP, npm tarball, checksums, clean-install report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/blender-mcp-master
          cp -R SKILL.md README.md LICENSE CHANGELOG.md CONTRIBUTING.md references scripts integrations assets docs dist/blender-mcp-master/
          (cd dist && zip -q -r "blender-mcp-master-${VERSION}.zip" blender-mcp-master)
          npm pack --ignore-scripts --pack-destination dist
          (cd dist && sha256sum "blender-mcp-master-${VERSION}.zip" "blender-mcp-master-${VERSION}.tgz" > SHA256SUMS.txt)
          python scripts/clean_install_smoke.py "dist/blender-mcp-master-${VERSION}.zip" dist/SHA256SUMS.txt --report dist/clean-install-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile
          report = json.loads(Path("dist/clean-install-report.json").read_text(encoding="utf-8"))
          assert report["result"] == "PASS", report
          with ZipFile("dist/blender-mcp-master-1.4.0.zip") as archive:
              assert archive.testzip() is None
              files = set(archive.namelist())
              for needed in (
                  "integrations/roblox/studio_mesh_audit.lua",
                  "integrations/godot/gltf_import_probe.gd",
                  "docs/V1.5-V2.0-MILESTONES.md",
                  "docs/release-notes-1.4.md",
              ):
                  assert "blender-mcp-master/" + needed in files, needed
          PY
      - name: Publish user-approved GitHub release (not npm registry)
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GH_REPO}/branches/main" --jq '.commit.sha')" = "$RELEASE_SHA" || {
            echo "::error::Main moved before publishing"; exit 1;
          }
          if gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag now exists; refusing overwrite"; exit 1
          fi
          gh release create "$TAG" \
            "dist/blender-mcp-master-${VERSION}.zip" \
            "dist/blender-mcp-master-${VERSION}.tgz" \
            "dist/SHA256SUMS.txt" \
            "dist/clean-install-report.json" \
            --target "$RELEASE_SHA" \
            --title "Blender MCP Master v1.4.0" \
            --notes-file docs/release-notes-1.4.md \
            --latest
          gh release view "$TAG" --json url,tagName,isPrerelease
