name: Publish Blender MCP Master v2.0.0

# The maintainer authorized the v2.0.0 release. The release PR's merge
# subject opts in exactly once, after independent PR checks and main CI.
on:
  workflow_run:
    workflows: ["Static checks"]
    branches: [main]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: blender-mcp-master-v2.0.0
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'God-601/blender-mcp-master' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      TAG: v2.0.0
      ZIP_NAME: blender-mcp-master-2.0.0.zip
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Identify the authorized release commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git log -1 --format=%s)" = 'Publish Blender MCP Master v2.0.0' ]; then
            echo 'authorized=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify the authorized source and same-SHA CI
        if: steps.release.outputs.authorized == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git log -1 --format=%s)" = 'Publish Blender MCP Master v2.0.0'
          test "$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')" = "$RELEASE_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          package = json.loads(Path('package.json').read_text())
          lock = json.loads(Path('package-lock.json').read_text())
          assert (package['version'], lock['version'], lock['packages']['']['version']) == ('2.0.0',) * 3
          PY
          for attempt in $(seq 1 36); do
            runs=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$RELEASE_SHA&event=push&branch=main&per_page=100")
            waiting=0
            for workflow in 'npm-package.yml' 'release-readiness.yml' 'godot-import-smoke.yml'; do
              conclusion=$(jq -r --arg path ".github/workflows/$workflow" --arg sha "$RELEASE_SHA" '
                [.workflow_runs[] | select(.path == $path and .head_sha == $sha and .head_branch == "main" and .event == "push")]
                | sort_by(.run_number) | last | .conclusion // "pending"' <<< "$runs")
              case "$conclusion" in
                success) ;;
                pending) waiting=1 ;;
                *) echo "::error::$workflow ended with $conclusion for $RELEASE_SHA"; exit 1 ;;
              esac
            done
            if [ "$waiting" -eq 0 ]; then exit 0; fi
            sleep 10
          done
          echo "::error::Same-SHA checks did not finish"
          exit 1
      - name: Build and test the final standalone ZIP
        if: steps.release.outputs.authorized == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --prefix=blender-mcp-master/ -o "dist/$ZIP_NAME" "$RELEASE_SHA" \
            SKILL.md README.md LICENSE CHANGELOG.md CONTRIBUTING.md references scripts integrations assets docs
          (cd dist && sha256sum "$ZIP_NAME" > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          python3 scripts/clean_install_smoke.py "dist/$ZIP_NAME" dist/SHA256SUMS.txt --report dist/clean-install-report.json
      - name: Publish the verified ZIP on GitHub
        if: steps.release.outputs.authorized == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')" = "$RELEASE_SHA"
          existing=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG")
          if jq -e --arg tag "refs/tags/$TAG" 'any(.[]; .ref == $tag)' <<< "$existing" >/dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi
          gh release create "$TAG" "dist/$ZIP_NAME" dist/SHA256SUMS.txt dist/clean-install-report.json \
            --target "$RELEASE_SHA" --title "Blender MCP Master v2.0.0" \
            --notes-file docs/release-notes-2.0.md --latest
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$RELEASE_SHA"
          gh release view "$TAG" --json url,tagName,isDraft,isPrerelease,assets
