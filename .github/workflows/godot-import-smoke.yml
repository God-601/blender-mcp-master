name: Real Godot 4 GLB importer smoke

# This workflow runs the external Godot executable. It does NOT certify
# Codex/Claude behavior, artistic quality, source-scene preservation or Roblox.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-headless-import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Create isolated, deterministic test-only GLB
        run: |
          mkdir -p "$RUNNER_TEMP/godot-fixtures"
          python integrations/godot/create_smoke_glb.py "$RUNNER_TEMP/godot-fixtures/smoke.glb"
          sha256sum "$RUNNER_TEMP/godot-fixtures/smoke.glb"
      - name: Install Blender bpy for real Blender-to-Godot integration
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libxi6 libxrender1 libxxf86vm1 libxfixes3 libsm6 libxkbcommon0
          pip install bpy==4.5.15
      - name: Export a Blender-authored UV/material GLB
        run: |
          python integrations/godot/blender_export_fixture.py "$RUNNER_TEMP/godot-fixtures/from-blender.glb"
          test -s "$RUNNER_TEMP/godot-fixtures/from-blender.glb"
          sha256sum "$RUNNER_TEMP/godot-fixtures/from-blender.glb"
      - name: Download official Godot headless-capable executable
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 --output "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot"
          "$RUNNER_TEMP/godot" --headless --version
      - name: Import real GLB with Godot and capture diagnostic output
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot" --headless --path integrations/godot \
            --script res://gltf_import_probe.gd -- "$RUNNER_TEMP/godot-fixtures/smoke.glb" \
            | tee "$RUNNER_TEMP/godot-import-result.log"
          "$RUNNER_TEMP/godot" --headless --path integrations/godot \
            --script res://gltf_import_probe.gd -- "$RUNNER_TEMP/godot-fixtures/from-blender.glb" \
            | tee "$RUNNER_TEMP/godot-blender-import-result.log"
      - name: Require positive importer observations (not a visual quality claim)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          log = (Path(os.environ['RUNNER_TEMP']) / 'godot-import-result.log').read_text()
          block = log.split('BLENDER_MCP_GODOT_IMPORT_BEGIN', 1)[1].split('BLENDER_MCP_GODOT_IMPORT_END', 1)[0].strip()
          result = json.loads(block)
          assert result['status'] == 'IMPORTED_GEOMETRY', result
          assert result['mesh_instances'] >= 1, result
          assert result['mesh_surfaces'] >= 1, result
          assert result['triangle_primitives'] == 1, result
          assert result['uv_surfaces'] >= 1, result
          assert result['material_surfaces'] >= 1, result
          assert result['visual_quality'] == 'NOT VERIFIED', result
          assert result['collision'] == 'NOT VERIFIED', result
          print(json.dumps(result, indent=2, sort_keys=True))
          from_blender_log = (Path(os.environ['RUNNER_TEMP']) / 'godot-blender-import-result.log').read_text()
          blender_result = json.loads(from_blender_log.split('BLENDER_MCP_GODOT_IMPORT_BEGIN', 1)[1].split('BLENDER_MCP_GODOT_IMPORT_END', 1)[0].strip())
          assert blender_result['status'] == 'IMPORTED_GEOMETRY', blender_result
          assert blender_result['triangle_primitives'] >= 12, blender_result
          assert blender_result['uv_surfaces'] >= 1, blender_result
          assert blender_result['material_surfaces'] >= 1, blender_result
          assert blender_result['visual_quality'] == 'NOT VERIFIED'
          print("Blender-to-Godot import:", json.dumps(blender_result, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: real-godot-glb-import-smoke
          path: |
            ${{ runner.temp }}/godot-import-result.log
            ${{ runner.temp }}/godot-fixtures/smoke.glb
            ${{ runner.temp }}/godot-blender-import-result.log
            ${{ runner.temp }}/godot-fixtures/from-blender.glb
          if-no-files-found: warn
          retention-days: 14
